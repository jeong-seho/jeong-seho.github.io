<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;1,700&amp;display=swap">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</head>

<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <!--
        Liquid Glass refraction filters. The maps are generated with the
        zero-dependency generator from Zettersten/skills.
    -->
    <svg class="liquid-glass-filters" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" width="0" height="0">
        <defs>
            <filter id="liquid-glass-nav-filter" color-interpolation-filters="sRGB" x="0%" y="0%" width="100%" height="100%">
                <feImage id="liquid-glass-nav-image" result="nav-displacement" x="0" y="0" width="1" height="64" preserveAspectRatio="none" href="" />
                <feDisplacementMap in="SourceGraphic" in2="nav-displacement" scale="-18" xChannelSelector="R" yChannelSelector="G" />
            </filter>

            <filter id="liquid-glass-card-filter" color-interpolation-filters="sRGB" x="0%" y="0%" width="100%" height="100%">
                <feImage result="card-displacement" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" href="{{ '/assets/img/liquid-glass-card.png' | relative_url }}" />
                <feDisplacementMap in="SourceGraphic" in2="card-displacement" scale="-22" xChannelSelector="R" yChannelSelector="G" />
            </filter>

            <filter id="liquid-glass-card-expanded-filter" color-interpolation-filters="sRGB" x="0%" y="0%" width="100%" height="100%">
                <feImage result="expanded-card-displacement" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" href="{{ '/assets/img/liquid-glass-card-expanded.png' | relative_url }}" />
                <feDisplacementMap in="SourceGraphic" in2="expanded-card-displacement" scale="-22" xChannelSelector="R" yChannelSelector="G" />
            </filter>

            <filter id="liquid-glass-profile-filter" color-interpolation-filters="sRGB" x="0%" y="0%" width="100%" height="100%">
                <feImage result="profile-displacement" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" href="{{ '/assets/img/liquid-glass-profile.png' | relative_url }}" />
                <feDisplacementMap in="SourceGraphic" in2="profile-displacement" scale="-20" xChannelSelector="R" yChannelSelector="G" />
            </filter>

            <filter id="liquid-glass-button-filter" color-interpolation-filters="sRGB" x="0%" y="0%" width="100%" height="100%">
                <feImage id="liquid-glass-button-image" result="button-displacement" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" href="" />
                <feDisplacementMap in="SourceGraphic" in2="button-displacement" scale="-14" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

    <div class="background-orbs" aria-hidden="true">
        <span class="background-orb background-orb--one"></span>
        <span class="background-orb background-orb--two"></span>
        <span class="background-orb background-orb--three"></span>
    </div>

    {% include nav.html %}

    <main id="main-content" class="page" tabindex="-1">
        {{ content }}
    </main>

    <footer class="footer">
        <p>© {{ site.time | date: '%Y' }} {{ site.title }}</p>
    </footer>
</body>
</html>
