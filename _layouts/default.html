<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title }}</title>
    <meta name="description" content="{{ site.description | escape }}">
    <meta name="google-site-verification" content="kb1AH4Y1ddABcwNgvBo9y5VJLG8T5YwBz3-cWP8JLBQ" />
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}" sizes="any">
    <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}" sizes="180x180">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,700;1,500;1,700&amp;display=swap">
    <!-- Build-versioned URLs keep cached assets in sync with the page. -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <script src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</head>

<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    {% include nav.html %}

    <main id="main-content" class="page" tabindex="-1">
        {{ content }}
    </main>

    <footer class="footer">
        <p>© {{ site.time | date: '%Y' }} {{ site.title }}</p>
    </footer>
</body>
</html>
