<header class="site-header">
    <div class="nav-wrap">
        <a class="site-brand" href="#home" aria-label="Seho Jeong — Home">{{ site.title }}</a>

        <nav class="nav" aria-label="Primary navigation">
            {% for item in site.nav %}
                <a href="{{ item.url }}">
                    <span class="nav-label">{{ item.title }}</span>
                </a>
            {% endfor %}
            <a class="nav-cv" href="{{ '/assets/cv/cv.pdf' | relative_url }}" aria-label="Curriculum vitae (PDF)"><span class="nav-label">CV</span></a>
        </nav>
    </div>
</header>
