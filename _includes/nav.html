<header class="site-header liquid-glass">
    <span class="liquid-glass__refract liquid-glass__refract--nav" aria-hidden="true"></span>
    <span class="liquid-glass__tint" aria-hidden="true"></span>
    <span class="liquid-glass__specular" aria-hidden="true"></span>

    <div class="nav-wrap liquid-glass__content">
        <nav class="nav" aria-label="Primary navigation">
            {% for item in site.nav %}
                <a href="{{ item.url }}">
                    {{ item.title }}
                </a>
            {% endfor %}
        </nav>
    </div>
</header>
