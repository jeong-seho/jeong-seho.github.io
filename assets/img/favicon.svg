<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
    <title>Seho Jeong — Dancheong lotus</title>
    <desc>An original, simplified eight-petal lotus inspired by Korean Dancheong.</desc>
    <defs>
        <path id="petal" d="M32 3C23 8 23 17 32 27C41 17 41 8 32 3Z"/>
    </defs>
    <g stroke="#F5F6F7" stroke-width="1.8" stroke-linejoin="round">
        <g fill="#4D8576">
            <use href="#petal" transform="rotate(45 32 32)"/>
            <use href="#petal" transform="rotate(135 32 32)"/>
            <use href="#petal" transform="rotate(225 32 32)"/>
            <use href="#petal" transform="rotate(315 32 32)"/>
        </g>
        <g fill="#1B6387">
            <use href="#petal"/>
            <use href="#petal" transform="rotate(90 32 32)"/>
            <use href="#petal" transform="rotate(180 32 32)"/>
            <use href="#petal" transform="rotate(270 32 32)"/>
        </g>
    </g>
    <circle cx="32" cy="32" r="11" fill="#C64D38" stroke="#F5F6F7" stroke-width="2"/>
    <circle cx="32" cy="32" r="4" fill="#D9B872"/>
</svg>
